const DawnLearning=(()=>{
const normalize=(s,sensitive)=>{let v=String(s).trim().replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ');return sensitive?v:v.toLowerCase();};

const DawnDevice=(()=>{
let handle,opening,unavailableUntil=0;

  try{request=globalThis.indexedDB.open('dawn-review-learning-v1',2);request.onupgradeneeded=()=>{for(const name of ['attempts','sessions'])if(!request.result.objectStoreNames.contains(name))request.result.createObjectStore(name,{keyPath:'id'});};request.onsuccess=()=>end(null,request.result);request.onerror=()=>end(new Error('学习记录存储无法打开'));request.onblocked=()=>end(new Error('旧页面占用了学习记录存储'));}catch(e){end(e);}
 }).finally(()=>{opening=null;});return opening;

async function transaction(names,mode,work){const d=await db();return new Promise((resolve,reject)=>{let t,settled=false,value;const finish=error=>{if(settled)return;settled=true;clearTimeout(timer);if(error){failed();reject(error);}else resolve(value);};const timer=setTimeout(()=>{try{t?.abort();}catch{}finish(new Error('学习记录存储响应超时'));},DEADLINE);try{t=d.transaction(names,mode);t.oncomplete=()=>finish();t.onerror=()=>finish(new Error('学习记录保存失败'));t.onabort=()=>finish(new Error('学习记录存储已中断'));work(t,v=>{value=v;});}catch(e){try{t?.abort();}catch{}finish(e);}});}

function sessions(){return read('sessions','startedAt');}
function saveSession(value){return write({sessions:[value]});}
function saveProgress(attempt,session){return write({attempts:[attempt],sessions:[session]});}
function saveAttempt(value){return write({attempts:[value]});}
function validateAttempts(list){if(!Array.isArray(list)||list.length>100000||list.some(a=>!a?.id||!a.questionId||!a.at||typeof a.correct!=='boolean'))throw new Error('学习备份格式无效');}

async function restoreLearning(backup){if(!['1.0.0','1.1.0'].includes(backup?.schemaVersion))throw new Error('备份版本不支持');validateAttempts(backup.attempts);const list=backup.sessions||[];if(!Array.isArray(list)||list.length>100000||list.some(s=>!s?.id||!s.startedAt||!Number.isInteger(s.planned)||!Number.isInteger(s.completed)))throw new Error('本轮记录格式无效');await write({attempts:backup.attempts,sessions:list});}

function home(){stopAudio();phase='start';const activeCount=Object.values(stats(history)).filter(x=>x.active).length;root.innerHTML=top()+`<main class="study-home"><div class="eyebrow">每天一点，把知识连起来。</div><h1>今天，再前进一步。</h1><p class="study-lead">把单词放进短语，把用法放进句子。<br>从熟悉到会用，按自己的节奏来。</p>${storageError?`<p class="notice danger">${esc(storageError)}</p>`:''}<div class="study-summary"><span><b>${content.items.length}</b> 个知识点</span><span><b>${content.exercises.length}</b> 组训练</span><span><b>${activeCount}</b> 项待巩固</span></div><div class="mode-grid">${Object.entries(names).map(([k,v],i)=>`<button class="mode-card ${selection.mode===k?'selected':''}" data-mode="${k}" aria-pressed="${selection.mode===k}"><span class="mode-index">0${i+1}</span><strong>${v}</strong><small>${['读准、记牢，再默写','成组记搭配，辨清介词','在句子中辨认词的用法','派生与词形变化分别练'][i]}</small></button>`).join('')}</div><div class="study-planner"><label>复习范围<select id="study-unit"><option value="all">全部已确认单元</option>${[...new Set(content.exercises.map(q=>q.unit))].map(u=>`<option value="${esc(u)}" ${u===selection.unit?'selected':''}>${esc(content.units?.find(v=>v.id===u)?.name||u)}</option>`).join('')}</select></label><label>同类复习<select id="study-topic"><option value="all">全部主题与搭配</option>${[...new Set(content.exercises.flatMap(q=>q.tags||[]))].map(t=>`<option value="${esc(t)}" ${t===selection.topic?'selected':''}>${esc(t)}</option>`).join('')}</select></label><label>每轮组数<select id="study-size">${[10,20,30].map(n=>`<option value="${n}" ${n===selection.size?'selected':''}>${n} 组</option>`).join('')}</select></label><label class="checkline"><input id="study-all" type="checkbox" ${selection.all?'checked':''}> 包含已掌握项</label><button class="button primary large" id="start" ${historyReady?'':'disabled'}>${historyReady?'开始这一轮':'读取本机记录…'}</button></div><p class="fineprint">字母提示：${levels[content.learningSettings?.hintDifficulty]||'中等'} · 复合词组按顺序逐项练习。<br>学习记录保存在当前浏览器，可导出备份。${content.localPreview?' 当前为本机教材预览。':''}</p></main>`+footer();

function start(){if(!historyReady)return;const pool=content.exercises.filter(q=>(selection.mode==='all'||q.mode===selection.mode)&&(selection.unit==='all'||q.unit===selection.unit)&&(selection.topic==='all'||q.tags?.includes(selection.topic)));run=expandPlan(plan(pool,history,selection.size,selection.all));if(!run.length){toast('当前范围没有新题或待巩固项，可切换题型或开启全面复习。');return;}index=0;round=[];currentSession={id:crypto.randomUUID(),startedAt:new Date().toISOString(),releaseId:content.releaseId,hintDifficulty:content.learningSettings?.hintDifficulty||'medium'};const value=updateSession();persist(()=>saveSession(value));nextQuestion();}

esc(c)}" aria-pressed="false">${esc(c)}</button>`).join('')}</div><input name="answer" type="hidden" value="">`:`<label class="answer-label" for="answer-input">看中文，填写英文</label><input class="answer-input" id="answer-input" name="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在这里输入答案" required>`}<div class="hint-text" id="hint-text" aria-live="polite"></div><div class="answer-controls"><button type="button" class="button light" id="hint">给我一点提示</button><button class="button primary large" type="submit">提交答案</button></div></form>`}`}</section></div></div><p class="fineprint practice-note">${assisted?'使用提示会单独记录，不计入独立掌握。':'本轮答案和提示难度固定；未作答的题目不计入统计。'}${storageError?' '+esc(storageError):''}</p></main>`+footer();bindTop();
 if(phase==='read'){$('#audio').onclick=()=>speakSequence(q.groupSegments?.map(s=>s.speechText||s.answers[0])||[q.speechText||q.answers[0]],speed,i=>root.querySelectorAll('[data-audio-part]').forEach(el=>el.classList.toggle('speaking',Number(el.dataset.audioPart)===i)),toast);$('#speed').onchange=e=>speed=Number(e.target.value);$('#read-done').onclick=()=>{stopAudio();phase='answer';renderQuestion();};}

function finish(){phase='done';stopAudio();const s=roundSummary(round,run.length),completed=currentSession?.reason==='completed';root.innerHTML=top()+`<main class="study-home finish"><p class="eyebrow">${completed?'这一轮，已经走完。':'本轮已结束，进步已留下。'}</p><h1>学会一点，就前进一步。</h1><div class="finish-count"><b>${s.independent}</b><span>/ ${s.completed} 题独立答对</span></div><div class="finish-metrics"><span>计划 ${s.planned} 题</span><span>已答 ${s.completed} 题</span><span>提示 ${s.assisted} 题</span><span>答错 ${s.wrong} 题</span></div><p class="study-lead">${s.completed?`${s.reinforce} 题会在后续巩固中优先出现。`:'这次还没有提交答案。'}<br>${s.unanswered?`还有 ${s.unanswered} 题未作答，不计入错题。`:'每天积累，不用急着一次记完。'}</p>${storageError?`<p class="notice danger">${esc(storageError)}，请导出记录。</p>`:''}<div class="button-row"><button class="button primary large" id="again">继续下一轮</button><button class="button light" id="home">回到复习首页</button></div><button class="text-button" id="export-round">导出本轮记录</button></main>`+footer();bindTop();$('#again').onclick=start;$('#home').onclick=home;$('#export-round').onclick=()=>download({schemaVersion:'1.1.0',attempts:round,sessions:[currentSession]},'晨光复习-本轮记录.json');}
function records(){stopAudio();phase='records';const groups=new Map();for(const a of history){if(!groups.has(a.sessionId))groups.set(a.sessionId,[]);groups.get(a.sessionId).push(a);}const ids=new Set([...groups.keys(),...sessionHistory.map(s=>s.id)]);const rows=[...ids].map(id=>({s:sessionHistory.find(s=>s.id===id),as:groups.get(id)||[]})).sort((a,b)=>(b.s?.startedAt||b.as[0]?.at||'').localeCompare(a.s?.startedAt||a.as[0]?.at||''));

 const show=day=>{const list=rows.filter(({s,as})=>!day||today(s?.endedAt||s?.startedAt||as[0]?.at)===day||as.some(a=>today(a.at)===day));$('#records-list').innerHTML=list.length?list.map(({s,as})=>`<details class="session-record"><summary><span>${new Date(s?.startedAt||as[0].at).toLocaleString('zh-CN')}<small>${s?(s.reason==='completed'?'完整完成':s.endedAt?'提前结束':'已保存进度'):'历史轮次'}</small></span><span>已答 ${as.length}${s?' / '+s.planned:''} 题 · ${as.filter(a=>a.correct&&!a.assisted).length} 题独立答对</span></summary>${as.length?as.map(a=>`<div class="attempt-row"><span class="pill ${a.correct&&!a.assisted?'success':'warning'}">${a.assisted?'有提示':a.correct?'答对':'待巩固'}</span><div><b>${esc(a.prompt)}</b><p>作答：${esc(a.answer)}　参考：${a.answers.map(esc).join(' / ')}</p><small>${names[a.mode]} · ${esc(a.releaseId)}</small></div></div>`).join(''):'<p class="muted">未提交答案，没有新增错题。</p>'}</details>`).join(''):'<div class="empty-state">这个日期还没有学习记录。</div>';};show($('#date').value);$('#date').onchange=e=>show(e.target.value);$('#all-records').onclick=()=>show('');$('#back').onclick=home;$('#export').onclick=()=>download({schemaVersion:'1.1.0',createdAt:new Date().toISOString(),attempts:history,sessions:sessionHistory},'晨光复习-学习备份.json');$('#restore').onchange=async e=>{try{const b=JSON.parse(await e.target.files[0].text());await restoreLearning(b);history=await attempts();sessionHistory=await sessions();records();toast('备份已合并，同ID记录去重。');}catch(e){toast(e.message);}};}
